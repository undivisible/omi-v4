[package]
name = "omi-rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "omi_rust"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

# Host `cargo test` stays on core-only. On the Zephyr target the `zephyr`
# crate provides GPIO / sync / time. That crate needs the Parent-status
# patch in patches/zephyr-lang-rust-parent-disabled.patch (see README).
[target.'cfg(target_os = "none")'.dependencies]
zephyr = "0.1.0"

[profile.release]
panic = "abort"
opt-level = "s"

[profile.dev]
panic = "abort"
