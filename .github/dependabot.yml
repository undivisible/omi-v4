version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /app/native/hub
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /worker-rs
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /firmware/omi/rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
