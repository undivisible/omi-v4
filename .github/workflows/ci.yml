name: CI

on:
  push:
    paths-ignore:
      - 'firmware/**'
  pull_request:
    paths-ignore:
      - 'firmware/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native/hub -> target
          shared-key: flutter-rinf
      # crepuscularity_flutter (the currents renderer) is pinned in app/pubspec.yaml
      # to a public GitHub ref, so `flutter pub get` resolves it without a sibling
      # checkout. Once the package is published to pub.dev, pin it via the crepus
      # tooling instead by enabling the step below (emits the exact dependency
      # block, so the ref/version lives in one place):
      #   - run: crepus flutter add --version "$CREPUS_FLUTTER_VERSION"
      - run: cargo install rinf_cli --version 8.10.0 --locked
      - run: flutter pub get
      - run: bash tool/check_rinf_bindings.sh
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: bash tool/analyze.sh
      - run: flutter test
      - run: flutter build web
      - run: flutter build apk --release

  flutter-apple-aot:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release --config-only
      - name: Build macOS without signing
        run: |
          set -euo pipefail
          cd macos
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build
      - run: flutter build ios --release --no-codesign

  flutter-windows-aot:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
        env:
          PUB_CACHE: ${{ runner.temp }}\pub-cache

  worker-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: worker-rs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Checkout moonshine beside the repo
        working-directory: .
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/tschk/moonshine.git "$GITHUB_WORKSPACE/../moonshine"
          cd "$GITHUB_WORKSPACE/../moonshine"
          bun install --frozen-lockfile
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-rs -> target
          shared-key: worker-rs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --lib
      - run: bun run test:tail
      - run: cargo install worker-build --version 0.8.5 --locked
      - name: Typecheck and test moonshine site
        working-directory: site/web-moonshine
        run: bun install --frozen-lockfile && bunx tsc --noEmit && bun test
      - run: bun run deploy:dry-run

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/native/hub
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native/hub -> target
          shared-key: hub
      - run: cargo fmt --check
      - run: bash ../../tool/check_native_target_dependencies.sh
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --all-targets --all-features
      - run: cargo test --all-features

  hub-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/native/hub
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native/hub -> target
          shared-key: hub-macos
      - name: Hub quality + computer-use probe
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macos:/usr/lib/swift"
          bash ../../../scripts/hub-quality.sh
          bash ../../../scripts/hub-computer-use.sh
      - name: Praefectus capability report
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macos:/usr/lib/swift"
          cargo test --lib computer_use::tests::native_praefectus_capabilities_probe_is_internally_consistent -- --exact --nocapture
