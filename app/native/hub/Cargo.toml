[package]
name = "hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

# FaceTime / headless Chromium call join is product-deferred (worker returns
# 501; no bridge container). Keep the stack compiling under `--features
# facetime` / `--all-features`, but leave it out of default mobile/desktop
# builds so the CDP browser path does not ship until product turns it on.
[features]
default = []
facetime = []

[dependencies]
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# FIND-020 / RUSTSEC-2025-0141: `rinf` pulls unmaintained `bincode` 1.x for
# Dart↔Rust signal codec. Advisory is informational (unmaintained), not a
# known exploit. Do not yank or replace rinf here — watch
# https://github.com/cunarist/rinf for a postcard/rkyv (or other) codec, or
# pin a rinf release that drops bincode; until then accept the transitive
# dep and re-check on every rinf upgrade.
rinf = "8.10.0"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rs_ai = "0.2.22"
rs_ai_core = "0.2.21"
rx4 = { version = "0.4.0", default-features = false, features = ["zkr-memory", "personality"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.9"
rusqlite = "0.37"
tract-onnx = "0.23.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
zkr = "0.4.0"
wsola = "0.1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }

# praefectus 0.4.0 does not build on Linux (x11rb/zbus) or current Windows
# (windows 0.62 API break), so computer-use stays macOS-only until upstream
# catches up.
[target.'cfg(target_os = "macos")'.dependencies]
corti-coreaudio = "=0.5.1"
ed25519-dalek = "2"
praefectus = "=0.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
rs_ai_local = { version = "0.2.21", features = ["foundationmodels"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[profile.release]
# Stripping the whole release graph breaks proc-macro dylibs on macOS.
strip = false

[profile.release.package.hub]
strip = "symbols"
